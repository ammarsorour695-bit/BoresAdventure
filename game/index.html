<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bore's Adventure</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Dialogue UI Layer -->
        <div id="ui-layer">
            <div id="speaker-name">NPC</div>
            <div id="dialogue-text"></div>
            <div class="prompt">Press [SPACE] to continue</div>
        </div>

        <!-- Quest Log -->
        <div id="quest-log">
            <h3>Current Mission</h3>
            <p id="quest-title">None</p>
            <p id="quest-desc">Explore the city.</p>
        </div>
        
        <!-- Start Screen -->
        <div id="start-screen">
            <h1>BORE'S ADVENTURE</h1>
            <p>Use Arrow Keys or WASD to Move</p>
            <p>Press 'E' to Interact with NPCs</p>
            <button id="start-btn">Start Game</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
